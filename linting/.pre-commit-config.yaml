# Pre-commit hooks that enforce the coding standards automatically on every
# commit. Install once per clone:
#
#   pip install pre-commit && pre-commit install
#
# Then the checks run on staged files at commit time. Adjust the `rev` pins and
# the check.py path if you vendored the linting/ folder somewhere else.

repos:
  # Ruff: naming, docstrings, param counts, broad-except, magic values (Python).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--config, ruff.toml]

  # ESLint: size, naming, jsdoc, magic numbers (TS/JS). Uses the project's local
  # eslint + config; remove this hook if the repo has no JS/TS.
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.12.0
    hooks:
      - id: eslint
        files: \.(ts|tsx|js|jsx)$
        additional_dependencies:
          - eslint@9.12.0
          - typescript-eslint@8.8.0
          - eslint-plugin-jsdoc@50.3.0

  # The exact 50-line / 250-line thresholds, which the linters can't measure.
  - repo: local
    hooks:
      - id: coding-standards-line-limits
        name: coding-standards line limits (50/250)
        entry: python linting/check.py
        language: system
        pass_filenames: true
        types_or: [python, javascript, ts, tsx]
